name: Build Module Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, json
      
      - name: Extract module version
        id: version
        run: |
          # Extraer versión directamente del archivo usando grep y regex
          VERSION=$(grep -oP "\\\$this->version\s*=\s*['\"]([0-9]+\.[0-9]+\.[0-9]+)['\"]" core/modules/modEasyocr.class.php | grep -oP "[0-9]+\.[0-9]+\.[0-9]+")
          
          # Validar que la versión tiene formato X.X.X
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid version format: $VERSION"
              exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Module version detected: $VERSION"
      
      - name: Create module archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="module_easyocr-${VERSION}.zip"
          
          echo "Creating archive: $ARCHIVE_NAME"
          
          # Crear directorio temporal con la estructura deseada
          mkdir -p temp_build/easyocr
          
          # Copiar todos los archivos al directorio easyocr, excluyendo archivos innecesarios
          rsync -av --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='node_modules' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='*.log' \
            --exclude='temp_build' \
            --exclude='claude.md' \
            --exclude='.specstory' \
            --exclude='tests/' \
            ./ temp_build/easyocr/
          
          # Crear el archivo zip desde el directorio temporal
          cd temp_build
          zip -r "../$ARCHIVE_NAME" easyocr
          cd ..
          
          # Limpiar directorio temporal
          rm -rf temp_build
          
          # Verificar que el archivo se creó correctamente
          if [ ! -f "$ARCHIVE_NAME" ]; then
              echo "Error: Archive was not created"
              exit 1
          fi
          
          # Mostrar información del archivo
          ls -lh "$ARCHIVE_NAME"
          
          # Verificar estructura del zip
          echo "Archive structure:"
          unzip -l "$ARCHIVE_NAME" | head -20
          
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
        id: archive
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: module_easyocr-${{ steps.version.outputs.version }}
          path: module_easyocr-${{ steps.version.outputs.version }}.zip
          retention-days: 90
          if-no-files-found: error
      
      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          body: |
            ## EasyOCR Module v${{ steps.version.outputs.version }}
            
            Versión compilada automáticamente desde la rama principal.
            
            ### 📦 Instalación
            1. Descargar el archivo `module_easyocr-${{ steps.version.outputs.version }}.zip`
            2. Descomprimir en `custom/easyocr/` de tu instalación de Dolibarr
            3. Activar el módulo desde el panel de administración
            
            ### 📋 Cambios
            Ver [ChangeLog.md](https://github.com/${{ github.repository }}/blob/main/ChangeLog.md) para detalles completos.
            
            ### ℹ️ Información
            - **Commit**: ${{ github.sha }}
            - **Branch**: ${{ github.ref_name }}
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
          files: module_easyocr-${{ steps.version.outputs.version }}.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # El aviso de "hay version nueva" que ve un Dolibarr instalado lo sirve el panel de
      # licencias (SDL), no GitHub: sin este paso el modulo se publica y los clientes no se
      # enteran. Medido el 2026-09-30: SDL seguia en la 2.5.3 con la 2.7.0 y la 2.7.1 ya
      # publicadas aqui, porque este workflow no tenia el paso.
      #
      # Solo se REGISTRA la version, sin adjuntar el ZIP: la distribucion va por Dolistore y
      # por el asset del Release. Para que el panel sirviera la descarga habria que anadir
      # -F module_file=@<zip>.
      #
      # No bloquea el release: si SDL esta caido, el modulo YA esta publicado y solo falta el
      # aviso, que se lanza a mano con la skill publicar-modulo-sdl. De ahi continue-on-error.
      - name: Registrar la version en el panel de licencias (SDL)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        continue-on-error: true
        env:
          SDL_TOKEN: ${{ secrets.SDL_RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${SDL_TOKEN:-}" ]; then
            echo "::warning::Falta el secreto SDL_RELEASE_TOKEN: la $VERSION NO se registra en SDL y los clientes no veran el aviso de actualizacion."
            exit 0
          fi

          # Titulos de seccion de esta version, en UNA sola linea: SDL responde error si le
          # llegan saltos de linea, y una vez registrada NO reescribe la version (un segundo
          # POST devuelve 200 sin cambiar nada), asi que hay que acertar a la primera.
          #
          # El filtro quita EMOJIS y simbolos pero CONSERVA LOS ACENTOS (un tr -cd [:print:]
          # en locale C dejaba "resolucin"), y normaliza guiones y comillas tipograficas.
          CHANGELOG=$(awk -v v="$VERSION" 'index($0, "## [" v "]")==1 {flag=1; next} /^## \[/ {flag=0} flag && /^### /' ChangeLog.md | sed 's/^### //' | perl -CSD -pe 's/[\x{1F000}-\x{1FAFF}\x{2600}-\x{27BF}\x{2B00}-\x{2BFF}\x{FE0F}]//g; s/[\x{2010}-\x{2015}]/-/g; s/[\x{2018}\x{2019}]/\x27/g; s/[\x{201C}\x{201D}]/"/g; s/^[ 	]+|[ 	]+$//g;' | paste -sd '~' - | sed 's/~/. /g' | sed 's/  */ /g' | cut -c1-900)
          DOWNLOAD="https://github.com/$REPO/releases/download/v$VERSION/module_easyocr-$VERSION.zip"

          echo "Registrando easyocr $VERSION en SDL..."
          HTTP=$(curl -sS -o sdl-response.json -w '%{http_code}' --max-time 60 -X POST "https://sdl.easysoft.es/storeModuleVersion/easyocr" -H "X-Easysoft-Token: $SDL_TOKEN" -H 'Accept: application/json' -F "version=$VERSION" -F 'display_name=EasyOcr' -F "download_url=$DOWNLOAD" -F "changelog=$CHANGELOG" || echo '000')

          cat sdl-response.json 2>/dev/null || true
          echo ""
          rm -f sdl-response.json

      - name: Build summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE_NAME="module_easyocr-${VERSION}.zip"
          ARCHIVE_SIZE=$(ls -lh "$ARCHIVE_NAME" | awk '{print $5}')
          
          echo "## 📦 Build Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- **Archive**: $ARCHIVE_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: $ARCHIVE_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Module compiled and ready for distribution" >> $GITHUB_STEP_SUMMARY
